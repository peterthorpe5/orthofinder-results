[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orthofinder-results"
version = "0.4.1"
description = "Version-aware, queryable interrogation of OrthoFinder result sets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Peter Thorpe and collaborators"}]
dependencies = [
  "biopython>=1.84,<2",
  "duckdb>=1.4,<2",
  "numpy>=1.26,<3",
  "pyarrow>=18,<26",
  "pyvis>=0.3.2,<0.4",
]

[project.optional-dependencies]
app = [
  "networkx>=3,<4",
  "plotly>=6,<7",
  "scipy>=1.14,<2",
  "streamlit>=1.52,<2",
]
dev = [
  "coverage>=7.6,<8",
  "build>=1.2,<2",
  "pycodestyle>=2.12,<3",
  "pydocstyle>=6.3,<7",
  "pytest>=8,<9",
  "ruff>=0.15,<1",
  "networkx>=3,<4",
  "plotly>=6,<7",
  "scipy>=1.14,<2",
  "streamlit>=1.52,<2",
]

[project.urls]
Repository = "https://github.com/peterthorpe5/orthofinder-results"
Issues = "https://github.com/peterthorpe5/orthofinder-results/issues"
Changelog = "https://github.com/peterthorpe5/orthofinder-results/blob/main/CHANGELOG.md"

[project.scripts]
orthofinder-results = "orthofinder_results.cli:main"
orthofinder-interrogation-app = "orthofinder_interrogation_app.launcher:main"
orthofinder-taxonomy-map = "orthofinder_interrogation_app.taxonomy_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["orthofinder_results", "orthofinder_interrogation_app"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95
precision = 2

[tool.pycodestyle]
max-line-length = 100
exclude = ".git,__pycache__,build,dist"

[tool.pydocstyle]
convention = "google"
add-ignore = ["D105", "D107", "D202"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/orthofinder_results/report.py" = ["E501"]
